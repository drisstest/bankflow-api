name: Docker Build & Push

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/bankflow-api:latest
            ghcr.io/${{ github.actor }}/bankflow-api:${{ github.sha }}

      # Bonus TP5 : scan de vulnérabilités de l'image avec Trivy
      - name: Scan Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.actor }}/bankflow-api:latest
          format: table
          exit-code: "0" # passe à "1" pour faire échouer la pipeline si CVE critique
          severity: CRITICAL,HIGH

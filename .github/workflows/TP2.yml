name: TP1

permissions:
  contents: read

on: 
    workflow_dispatch:

jobs: 
    Build_and_Test: 
        runs-on: ubuntu-latest

        strategy:
            matrix:
                python-version: [3.11, 3.12]
        
            fail-fast: false

        steps: 
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            
            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 #v7.1.0
              with: 
                python-version: ${{ matrix.python-version }}
                cache: 'pip' # garde une copie des dependances deja installés basés sur le hash du contenu du fichier requirements.txt ( cache-dependency-path: requirements.txt ) pour ne pas les reinstaller à chaque fois
                cache-dependency-path: requirements.txt
            
            - name: install dependencies an
              run: pip install -r requirements.txt 
                
            - name: Run tests
              run: | 
                flake8 app tests
                pytest --cov=app --cov-report=html 

            - name: Upload coverage report 
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with: 
                name: coverage-report-${{ matrix.python-version }}
                path: htmlcov/
              
